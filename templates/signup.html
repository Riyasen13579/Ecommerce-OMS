{% extends "base.html" %}
{% block title %}Sign Up — ShopOMS{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 fw-bold mb-4 text-center">👤 Create account</h2>
        <form method="POST" action="{{ url_for('signup') }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="john_doe" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Min 8 characters" minlength="8" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" name="confirm" class="form-control" placeholder="••••••••" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-semibold">Create account</button>
        </form>
        <hr>
        <p class="text-center text-muted mb-0">
          Already have an account?
          <a href="{{ url_for('login') }}" class="text-warning fw-semibold">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
